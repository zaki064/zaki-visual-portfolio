name: Add pixel-identical browser compatibility
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/compatible-media.yml'
permissions:
  contents: read
jobs:
  compatible:
    if: github.event_name == 'workflow_dispatch' || github.event.head_commit.message == 'Run one-time ZAKI pixel-identical compatibility repair'
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Install FFmpeg
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
      - name: Build and verify lossless compatible streams
        run: python3 scripts/build-compatible.py
