name: Reduce original-quality playback requests
on:
  push:
    branches: [main]
    paths: [scripts/regroup-streams.py]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: zaki-lossless-stream-build
  cancel-in-progress: false
jobs:
  bundle:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Install FFmpeg for packet verification
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
      - name: Join existing fragments and verify unchanged video bytes
        run: python3 scripts/regroup-streams.py
