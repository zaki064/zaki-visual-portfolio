<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ZAKI · 播放连接检查</title><style>
:root{color-scheme:dark}*{box-sizing:border-box}body{margin:0;background:#141214;color:#f0e9ed;font:16px/1.7 system-ui,-apple-system,"PingFang SC",sans-serif}main{max-width:760px;margin:0 auto;padding:32px 20px}h1{font-weight:500;color:#efb3cb;font-size:32px}p{color:#beb4bb}a{color:#efb3cb}button{cursor:pointer;border:1px solid #9a657d;border-radius:24px;background:#efb3cb;color:#191219;padding:12px 22px;font:inherit;margin:10px 8px 10px 0}button:disabled{opacity:.5}video{display:block;width:100%;max-height:360px;background:#000;object-fit:contain}li{margin:12px 0;padding:12px;background:#211b20;border-radius:12px;list-style:none}ul{padding:0}.ok{color:#a9d6b3}.bad{color:#ffb1bb}pre{white-space:pre-wrap;overflow-wrap:anywhere;font:13px/1.6 ui-monospace,monospace;background:#211b20;padding:16px;border-radius:12px}#conclusion{font-size:18px;color:#efb3cb}</style></head><body><main>
<a href="./play.html?v=20261011.4">← 返回播放修正版</a><h1>检查视频播放与加载速度</h1><p>点击一次检查即可，也会用约 4 MB 数据检测视频线路速度。结果只显示在当前浏览器，不会上传。完成后把下方结果复制给我；无需打开开发者工具。</p>
<button id="run">开始检查</button><button id="copy" disabled>复制检查结果</button><p id="conclusion" aria-live="polite"></p>
<video id="sample" src="./playback-sample.mp4?v=20261011.1" controls playsinline preload="none" muted aria-label="同一网站内的原画质播放测试片段"></video><p>这是一小段未重编码的测试片段，用于确认浏览器是否能播放页面内的视频。</p><ul id="rows"></ul><pre id="report" hidden></pre>
<script>
const run=document.getElementById('run'),copy=document.getElementById('copy'),rows=document.getElementById('rows'),sample=document.getElementById('sample'),out=document.getElementById('report'),conclusion=document.getElementById('conclusion');let report;
const show=(label,ok,detail)=>{const li=document.createElement('li');li.className=ok?'ok':'bad';li.textContent=(ok?'✓ ':'✕ ')+label+'：'+detail;rows.append(li)};
async function speedCheck(){
 const controller=new AbortController(),started=performance.now(),limit=4*1024*1024;
 const timer=setTimeout(()=>controller.abort(),45000);let bytes=0;
 try{const r=await fetch('https://raw.githubusercontent.com/zaki064/zaki-visual-portfolio/stream-media-v3/bundled-v1/zaki-showreel-web/b0001.m4s',{cache:'no-store',signal:controller.signal,headers:{Range:'bytes=0-'+(limit-1)}});if(!r.ok)throw Error('HTTP '+r.status);
  const reader=r.body.getReader();while(bytes<limit){const part=await reader.read();if(part.done)break;bytes+=part.value.byteLength}await reader.cancel();
  const ms=Math.round(performance.now()-started),mbps=bytes/1000000/(ms/1000),result={ok:true,bytes,ms,downloadMBPerSecond:Number(mbps.toFixed(2)),mainVideoMBPerSecond:4.31};
  show('本次视频线路测速',mbps>=4.31,mbps.toFixed(2)+' MB/秒；主混剪原片约需 4.31 MB/秒');return result;
 }catch(e){const result={ok:false,bytes,ms:Math.round(performance.now()-started),error:e.name==='AbortError'?'测速超过 45 秒':e.message};show('视频线路测速',false,result.error);return result}finally{clearTimeout(timer);controller.abort()}
}
async function probe(label,url,range=false){const controller=new AbortController(),started=performance.now();const timeout=setTimeout(()=>controller.abort(),10000);try{const r=await fetch(url,{signal:controller.signal,cache:'no-store',headers:range?{Range:'bytes=0-1023'}:{}});if(!r.ok)throw Error('HTTP '+r.status);const reader=r.body?.getReader();const first=reader?await reader.read():{value:await r.arrayBuffer()};await reader?.cancel();const result={label,ok:true,ms:Math.round(performance.now()-started),http:r.status,bytes:first.value?.byteLength||0};show(label,true,result.ms+' 毫秒');return result}catch(e){const result={label,ok:false,ms:Math.round(performance.now()-started),error:e.name==='AbortError'?'连接超过 10 秒未返回':e.message};show(label,false,result.error);return result}finally{clearTimeout(timeout);controller.abort()}}
run.onclick=async()=>{run.disabled=true;copy.disabled=true;rows.replaceChildren();out.hidden=true;conclusion.textContent='正在检查…';const media=new Promise(resolve=>{let timer;const done=ok=>{clearTimeout(timer);sample.removeEventListener('playing',yes);sample.removeEventListener('error',no);resolve({label:'浏览器实际解码',ok,error:ok?null:sample.error?.message||'未能起播',code:sample.error?.code||0,width:sample.videoWidth,height:sample.videoHeight})};const yes=()=>done(true),no=()=>done(false);sample.addEventListener('playing',yes);sample.addEventListener('error',no);timer=setTimeout(no,12000);sample.play().catch(no)});
 const checks=await Promise.all([probe('页面内播放清单','./streams/zaki-showreel-web/index.m3u8?v=20261011.4'),probe('页面内视频文件','./playback-sample.mp4?v=20261011.1',true),probe('后续视频分段域名','https://raw.githubusercontent.com/zaki064/zaki-visual-portfolio/stream-media-v3/bundled-v1/zaki-celebrity-01/b0001.m4s',true)]);const decoded=await media;show(decoded.label,decoded.ok,decoded.ok?decoded.width+' × '+decoded.height:decoded.error);sample.pause();const speed=checks[2].ok?await speedCheck():null;report={version:'20261011.4',browser:/Edg\//.test(navigator.userAgent)?'Edge':/Chrome\//.test(navigator.userAgent)?'Chrome':/Safari\//.test(navigator.userAgent)?'Safari':'其他',checks,decoded,speed};
 const local=checks[0].ok&&checks[1].ok;conclusion.textContent=local&&!checks[2].ok?'已确认：页面内视频可连接，后续视频域名连接失败。需要调整视频托管线路。':local&&!decoded.ok?'页面内文件能连接，但浏览器没有完成解码。请复制结果给我。':checks.every(x=>x.ok)&&decoded.ok?(speed?.ok&&speed.downloadMBPerSecond<4.31?'本次测速低于主混剪的原片码率，可能需要更长的缓冲。请复制结果给我。':'文件连接和浏览器解码通过。请复制结果给我，继续核对完整播放器。'):'部分页面内资源也无法连接。请复制结果给我。';out.textContent=JSON.stringify(report,null,2);out.hidden=false;copy.disabled=false;run.disabled=false;sample.pause()};
copy.onclick=async()=>{try{await navigator.clipboard.writeText(out.textContent);copy.textContent='已复制，粘贴给我即可'}catch{const range=document.createRange();range.selectNodeContents(out);const s=getSelection();s.removeAllRanges();s.addRange(range);copy.textContent='请复制已选中的结果'}};
</script></main></body></html>
